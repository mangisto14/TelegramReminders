services:

  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${DB_NAME:-reminders}
      POSTGRES_USER:     ${DB_USER:-botuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-botuser} -d ${DB_NAME:-reminders}"]
      interval: 10s
      timeout: 5s
      retries: 5

  bot:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      DB_HOST:            db
      DB_PORT:            5432
      DB_NAME:            ${DB_NAME:-reminders}
      DB_USER:            ${DB_USER:-botuser}
      DB_PASSWORD:        ${DB_PASSWORD}

volumes:
  postgres_data:
